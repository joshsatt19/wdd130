<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Examples</title>
    <style>
        /*This is a CSS comment*/
        @import url('https://fonts.googleapis.com/css2?family=Nabla&display=swap');
        body {
            background-color: rgb(24, 23, 23);
        }

        h1 {
            background-color: rgb(30, 29, 29);
            color: white;
            font-family: 'Nabla';
            position: relative;
            left: 500px;
            font-size: 64px;
        }

        p {
            background-color: rgb(115, 15, 15);
            font-family: 'Nabla';
            position: relative;
            left: 100px;
            text-decoration: underline wavy pink;
            font-size: 25px;
            
        }
    </style>
</head>

<body>
    <h1>CSS Example</h1>
    <p>This is an example of how to use CSS</p>
</body>

</html>
